<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D5CBD"/>
      <stop offset="1" stop-color="#042B59"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE9F7"/>
    </linearGradient>
  </defs>

  <!-- background tile -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- folder: tab + body -->
  <path d="M56,58 h50 a12,12 0 0 1 9.5,4.7 l10.5,13.3 h75.5 a12,12 0 0 1 12,12 v104 a12,12 0 0 1 -12,12 H56 a12,12 0 0 1 -12,-12 V70 a12,12 0 0 1 12,-12 Z"
        fill="url(#paper)"/>

  <!-- role badges -->
  <!-- screens: blue square -->
  <rect x="68" y="106" width="32" height="32" rx="7" fill="#1E88E5"/>
  <!-- widgets: cyan triangle -->
  <path d="M148,104 L167,138 L129,138 Z" fill="#00ACC1"/>
  <!-- models: orange diamond -->
  <path d="M84,152 L102,170 L84,188 L66,170 Z" fill="#FB8C00"/>
  <!-- state: purple dot, under the lens -->
  <circle cx="148" cy="170" r="15" fill="#8E24AA"/>

  <!-- magnifying lens over the purple badge -->
  <circle cx="148" cy="170" r="30" fill="#54C5F8" fill-opacity="0.18"/>
  <circle cx="148" cy="170" r="30" fill="none" stroke="#13324F" stroke-width="10"/>
  <line x1="170" y1="192" x2="198" y2="220" stroke="#13324F" stroke-width="14" stroke-linecap="round"/>
</svg>
